<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location History - GPS Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-color: #f59e0b;
            --secondary-color: #1f2937;
            --background-color: #f3f4f6;
            --text-color: #111827;
            --sidebar-bg: #ffffff;
            --sidebar-text: #374151;
            --sidebar-active: #f59e0b;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
        }

        /* Mobile menu overlay */
        .mobile-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 998;
        }

        .mobile-menu-btn {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            box-shadow: var(--shadow);
        }

        /* Sidebar Styles */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #374151;
        }

        .sidebar-header h3 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
        }

        .sidebar-nav {
            flex-grow: 1;
            padding: 20px 0;
        }

        .sidebar-nav h4 {
            padding: 0 20px 10px 20px;
            font-size: 12px;
            text-transform: uppercase;
            color: #9ca3af;
        }

        .sidebar-nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav li a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--sidebar-text);
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .sidebar-nav li a:hover {
            background-color: #d97706;
        }

        .sidebar-nav li.active a {
            background-color: var(--primary-color);
            color: black;
            font-weight: bold;
        }

        .sidebar-nav i {
            margin-right: 15px;
            width: 20px;
            text-align: center;
        }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: auto;
            min-width: 0;
        }

        /* Header & Controls */
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .history-header h2 {
            margin: 0;
            font-size: clamp(1.5rem, 4vw, 2rem);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .controls label {
            font-weight: bold;
            white-space: nowrap;
        }

        .controls input[type="date"] {
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            min-width: 140px;
        }

        .download-btn {
            padding: 8px 15px;
            background-color: var(--primary-color);
            color: white !important;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .download-btn:hover {
            background-color: #d97706;
            color: white !important;
        }

        .download-btn:active {
            color: white !important;
        }

        .download-btn:focus {
            color: white !important;
            outline: none;
        }

        .download-btn i {
            margin-right: 5px;
        }

        /* Map & Log Container */
        .history-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
            min-height: 0;
        }

        #map-container {
            height: 400px;
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
            flex-shrink: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* History Log Styles */
        .history-log {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 20px;
            overflow-y: auto;
            flex-grow: 1;
            min-height: 300px;
        }

        .history-log h3 {
            margin-top: 0;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
        }

        .timeline {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .timeline-item {
            display: flex;
            flex-direction: column;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 15px 20px;
            margin-bottom: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .timeline-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .timeline-item.active {
            border-left: 4px solid var(--primary-color);
            background-color: #fef3c7;
        }

        .timeline-details p {
            margin: 0 0 8px 0;
            font-size: 14px;
        }

        .timeline-details .address {
            font-size: 13px;
            color: #6b7280;
            display: block;
            margin: 5px 0;
        }

        .timeline-time {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 8px;
            font-size: 14px;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .mobile-menu-btn {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                z-index: 999;
                transform: translateX(-100%);
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-overlay.show {
                display: block;
            }

            .main-content {
                padding: 70px 15px 15px;
                margin-left: 0;
            }

            .history-header {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .history-header h2 {
                text-align: center;
                font-size: 1.5rem;
            }

            .controls {
                justify-content: center;
                flex-wrap: wrap;
                gap: 10px;
            }

            .controls label {
                font-size: 14px;
            }

            .controls input[type="date"] {
                flex-grow: 1;
                min-width: 120px;
            }

            .download-btn {
                flex-shrink: 0;
                padding: 10px 15px;
            }

            #map-container {
                height: 300px;
            }

            .history-log {
                padding: 15px;
                min-height: 250px;
            }

            .timeline-item {
                padding: 12px 15px;
                margin-bottom: 12px;
            }

            .timeline-details p {
                font-size: 13px;
            }

            .timeline-details .address {
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .main-content {
                padding: 70px 10px 10px;
            }

            .history-header h2 {
                font-size: 1.3rem;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .controls input[type="date"] {
                min-width: auto;
            }

            #map-container {
                height: 250px;
            }

            .history-log {
                padding: 12px;
                min-height: 200px;
            }

            .timeline-item {
                padding: 10px 12px;
            }

            .timeline-time {
                font-size: 13px;
            }

            .timeline-details p {
                font-size: 12px;
            }

            .timeline-details .address {
                font-size: 11px;
            }
        }

        /* Large screen optimization */
        @media (min-width: 1200px) {
            .history-container {
                flex-direction: row;
            }

            #map-container {
                flex: 1;
                height: auto;
                min-height: 500px;
            }

            .history-log {
                flex: 0 0 400px;
                max-height: 600px;
            }
        }
    </style>
</head>
<body>

<div class="mobile-overlay" id="mobile-overlay"></div>
<button class="mobile-menu-btn" id="mobile-menu-btn">
    <i class="fas fa-bars"></i>
</button>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <h3>🐾 PetTrack</h3>
    </div>
    <nav class="sidebar-nav">
        <h4>My Pets</h4>
        <ul>
            <li><a href="Buddy.html"><i class="fas fa-dog"></i> Buddy</a></li>
        </ul>
        <h4>Tools</h4>
        <ul>
            <li><a href="../index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li class="active"><a href="LocationHistory.html"><i class="fas fa-history"></i> Location History</a></li>
            <li><a href="Alerts.html"><i class="fas fa-bell"></i> Alerts</a></li>
            <li><a href="Settings.html"><i class="fas fa-cog"></i> Settings</a></li>
        </ul>
    </nav>
</aside>

<main class="main-content">
    <div class="history-header">
        <h2>Location History: Buddy</h2>
        <div class="controls">
            <label for="history-date">Select Date:</label>
            <input type="date" id="history-date" name="history-date" value="2025-07-17">
            <button class="download-btn"><i class="fas fa-download"></i> Download Report</button>
        </div>
    </div>

    <div class="history-container">
        <div id="map-container">
            <div id="map"></div>
        </div>

        <div class="history-log" id="history-log">
            <h3>Event Log</h3>
            <ul class="timeline" id="timeline">
                <li class="timeline-item" id="timeline-item-1">
                    <div id="item"></div>
            </ul>
        </div>
    </div>
</main>

<script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDg7_ygvD2iISNMCdpe1QJiIvY-RBZ6B6M&callback=initMap">
</script>

<script>
    // Mobile menu functionality
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('mobile-overlay');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        }

        mobileMenuBtn.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', closeSidebar);

        // Close sidebar when clicking on a link (mobile)
        const sidebarLinks = sidebar.querySelectorAll('a');
        sidebarLinks.forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth <= 768) {
                    closeSidebar();
                }
            });
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                closeSidebar();
            }
        });

        // Download button functionality
        const downloadBtn = document.querySelector('.download-btn');
        downloadBtn.addEventListener('click', function() {
            this.classList.add('clicked');
            this.style.color = 'white';

            setTimeout(() => {
                this.classList.remove('clicked');
            }, 200);
        });
    });
</script>

<script>
    let map;
    function initMap() {
        map = new google.maps.Map(document.getElementById("map"), {
            center: { lat: 6.9156, lng: 79.8606 },
            zoom: 15,
        });
    }
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyBoavfgTNXAaZzQYcchtafWuW_lE2erVRk",
        authDomain: "gpstracker-96510.firebaseapp.com",
        databaseURL: "https://gpstracker-96510-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "gpstracker-96510",
        storageBucket: "gpstracker-96510.firebasestorage.app",
        messagingSenderId: "70413476738",
        appId: "1:70413476738:web:85ce96d3b7905523f7a59b",
        measurementId: "G-V0BBJWMFZ3"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Global variables for map and markers
    let currentMarker = null;
    let polyline = null;
    const pathCoordinates = [];

    document.addEventListener("DOMContentLoaded", async () => {
        const timeline = document.getElementById("timeline");
        if (!timeline) return console.error("Timeline container not found");

        try {
            const snapshot = await get(ref(db, "/event"));
            if (snapshot.exists()) {
                const data = snapshot.val();
                timeline.innerHTML = "";

                const entries = Object.entries(data).map(([timestamp, entry]) => ({
                    timestamp,
                    ...entry
                }));

                entries.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

                const addTimelineItem = (entry, index, total) => {
                    const lat = Number(entry.location?.lat);
                    const lng = Number(entry.location?.lng);

                    const timestamp = new Date(entry.timestamp);
                    const isValidDate = !isNaN(timestamp.getTime());

                    const dateStr = isValidDate
                        ? timestamp.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' })
                        : "Invalid Date";

                    const timeStr = isValidDate
                        ? timestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true })
                        : "Invalid Time";

                    let label = "Movement Detected";
                    if (index === 0) label = "Movement Start";
                    if (index === total - 1) label = "Movement End";
                    if (!isValidDate) label = "Invalid Timestamp";

                    const li = document.createElement("li");
                    li.className = "timeline-item";
                    li.id = `timeline-item-${index + 1}`;

                    li.innerHTML = `
                    <div class="timeline-time" id="timeline-time-${index + 1}">
                        <div>${dateStr} | ${timeStr}</div>
                    </div>
                    <div class="timeline-details" id="timeline-details-${index + 1}">
                        <p id="timeline-label-${index + 1}"><strong>${label}</strong></p>
                        <span id="timeline-address-${index + 1}" class="address">
                            <i class="fas fa-map-marker-alt"></i>
                            ${!isNaN(lat) && !isNaN(lng) ? `Lat: ${lat.toFixed(5)}, Lng: ${lng.toFixed(5)}` : "Location unavailable"}
                        </span>
                        ${entry.speed ? `<span class="speed"><i class="fas fa-tachometer-alt"></i> Speed: ${entry.speed} km/h</span>` : ''}
                        ${entry.battery?.percent ? `<span class="battery"><i class="fas fa-battery-full"></i> Battery: ${entry.battery.percent}%</span>` : ''}
                    </div>
                `;

                    if (!isNaN(lat) && !isNaN(lng)) {
                        li.addEventListener('click', () => {
                            document.querySelectorAll('.timeline-item').forEach(item => {
                                item.classList.remove('active');
                            });

                            li.classList.add('active');

                            const position = new google.maps.LatLng(lat, lng);
                            map.setCenter(position);
                            map.setZoom(18);

                            if (currentMarker) {
                                currentMarker.setMap(null);
                            }

                            currentMarker = new google.maps.Marker({
                                position: position,
                                map: map,
                                title: `${dateStr} ${timeStr}`,
                                icon: {
                                    url: "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
                                }
                            });
                        });

                        pathCoordinates.push({ lat, lng });
                    }

                    timeline.appendChild(li);
                };

                entries.forEach((entry, index) => {
                    setTimeout(() => addTimelineItem(entry, index, entries.length), index * 200);
                });

                setTimeout(() => {
                    if (pathCoordinates.length > 0) {
                        polyline = new google.maps.Polyline({
                            path: pathCoordinates,
                            geodesic: true,
                            strokeColor: '#f59e0b',
                            strokeOpacity: 0.8,
                            strokeWeight: 5
                        });
                        polyline.setMap(map);
                    }
                }, entries.length * 200 + 500);

            } else {
                console.log("No location data found");
            }
        } catch (error) {
            console.error("Error fetching data:", error);
        }
    });
</script>

</body>
</html>
