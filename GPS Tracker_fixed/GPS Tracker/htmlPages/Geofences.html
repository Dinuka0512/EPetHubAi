<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geofences - GPS Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary-color: #f59e0b;
      --safe-zone-color: #f59e0b;
      --danger-zone-color: #ef4444;
      --sidebar-bg: #ffffff;
      --background-color: #f3f4f6;
      --card-bg: #ffffff;
      --sidebar-text: #374151;
      --sidebar-active: #f59e0b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      background-color: var(--background-color);
      display: flex;
      height: 100vh;
      overflow: hidden; /* Prevent body scroll */
    }

    /* Mobile Menu Button */
    .mobile-menu-btn {
      display: none;
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1001;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      font-size: 18px;
    }

    /* Sidebar Styles (Consistent with other pages) */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }
    .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid #374151; }
    .sidebar-header h3 { margin: 0; color: black; font-size: 24px; }
    .sidebar-nav { flex-grow: 1; padding: 20px 0; }
    .sidebar-nav h4 { padding: 0 20px 10px 20px; font-size: 12px; text-transform: uppercase; color: #9ca3af; }
    .sidebar-nav ul { list-style: none; padding: 0; margin: 0; }
    .sidebar-nav li a { display: flex; align-items: center; padding: 12px 20px; color: var(--sidebar-text); text-decoration: none; transition: background-color 0.3s; }
    .sidebar-nav li a:hover { background-color: #d97706; }
    .sidebar-nav li.active a { background-color: var(--primary-color); color: black; font-weight: bold; }
    .sidebar-nav i { margin-right: 15px; width: 20px; text-align: center; }

    /* Main Content Styles */
    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
    }
    .main-header h2 { margin: 0; }
    .create-btn {
      background-color: var(--primary-color);
      color: white !important;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .create-btn:hover {
      background-color: #d97706;
      color: white !important;
    }

    .create-btn:active {
      color: white !important;
    }

    .create-btn:focus {
      color: white !important;
      outline: none;
    }
    .create-btn i { margin-right: 8px; }

    /* Geofence Body Layout */
    .geofence-body {
      display: flex;
      flex-grow: 1;
      overflow: hidden; /* Prevent internal scrollbars */
    }

    /* Map Container */
    #map-container {
      width: 70%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* Geofence List Panel */
    .geofence-list-panel {
      width: 30%;
      background-color: var(--card-bg);
      border-left: 1px solid #e5e7eb;
      padding: 20px;
      overflow-y: auto;
    }
    .geofence-list-panel h3 { margin-top: 0; }
    .geofence-list { list-style: none; padding: 0; margin: 0; }
    .geofence-item {
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: var(--shadow);
    }
    .geofence-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .geofence-item-header h4 { margin: 0; }
    .geofence-type {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      color: white;
    }
    .type-safe { background-color: var(--primary-color); }
    .type-danger { background-color: var(--danger-zone-color); }

    .geofence-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #6b7280;
      margin-left: 10px;
    }
    .geofence-actions button:hover { color: var(--primary-color); }

    /* Responsive Styles */
    @media (max-width: 1024px) {
      .geofence-body {
        flex-direction: column;
      }

      #map-container {
        width: 100%;
        height: 400px;
        flex-shrink: 0;
      }

      .geofence-list-panel {
        width: 100%;
        border-left: none;
        border-top: 1px solid #e5e7eb;
        padding: 15px;
      }

      .sidebar {
        width: 220px;
      }
    }

    @media (max-width: 768px) {
      .mobile-menu-btn {
        display: block;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        z-index: 1000;
        transform: translateX(-100%);
        box-shadow: 2px 0 8px rgba(0,0,0,0.1);
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .main-content {
        margin-left: 0;
        width: 100%;
      }

      .main-header {
        padding: 70px 20px 20px 20px;
      }

      .main-header h2 {
        font-size: 20px;
      }

      #map-container {
        height: 300px;
      }

      .geofence-list-panel {
        padding: 10px;
      }

      .geofence-item {
        padding: 12px;
        margin-bottom: 10px;
      }

      .geofence-item-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
    }

    @media (max-width: 480px) {
      .main-header {
        flex-direction: column;
        gap: 15px;
        text-align: center;
        padding: 70px 10px 15px 10px;
      }

      .create-btn {
        width: 100%;
        padding: 12px 20px;
      }

      #map-container {
        height: 250px;
      }

      .geofence-list-panel {
        padding: 8px;
      }

      .geofence-item {
        padding: 10px;
      }

      .geofence-item-header h4 {
        font-size: 16px;
      }

      .geofence-type {
        font-size: 11px;
        padding: 3px 8px;
      }
    }

    /* Mobile Menu Overlay */
    .mobile-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 999;
    }

    .mobile-overlay.active {
      display: block;
    }
  </style>
</head>
<body>

<!-- Mobile Menu Button -->
<button class="mobile-menu-btn" onclick="toggleMobileMenu()">
  <i class="fas fa-bars"></i>
</button>

<!-- Mobile Overlay -->
<div class="mobile-overlay" onclick="closeMobileMenu()"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>🐾 PetTrack</h3>
  </div>
  <nav class="sidebar-nav">
    <h4>My Pets</h4>
    <ul>
      <li><a href="Buddy.html"><i class="fas fa-dog"></i> Buddy</a></li>
    </ul>
    <h4>Tools</h4>
    <ul>
      <li><a href="../index.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
      <li><a href="LocationHistory.html"><i class="fas fa-history"></i> Location History</a></li>
      <li class="active"><a href="Geofences.html"><i class="fas fa-draw-polygon"></i> Geofences</a></li>
      <li><a href="Alerts.html"><i class="fas fa-bell"></i> Alerts</a></li>
      <li><a href="Settings.html"><i class="fas fa-cog"></i> Settings</a></li>
    </ul>
  </nav>
</aside>

<main class="main-content">
  <header class="main-header">
    <h2>Manage Geofences</h2>
    <button class="create-btn"><i class="fas fa-plus"></i> Create New Geofence</button>
  </header>

  <div class="geofence-body">
    <div id="map-container">
      <div id="map"></div>
    </div>

    <aside class="geofence-list-panel">
      <h3>My Geofences</h3>
      <ul class="geofence-list">
        <li class="geofence-item">
          <div class="geofence-item-header">
            <h4>Home</h4>
            <span class="geofence-type type-safe">Safe Zone</span>
          </div>
          <div class="geofence-actions">
            <button title="Edit"><i class="fas fa-edit"></i></button>
            <button title="Delete"><i class="fas fa-trash-alt"></i></button>
          </div>
        </li>
        <li class="geofence-item">
          <div class="geofence-item-header">
            <h4>Local Park</h4>
            <span class="geofence-type type-safe">Safe Zone</span>
          </div>
          <div class="geofence-actions">
            <button title="Edit"><i class="fas fa-edit"></i></button>
            <button title="Delete"><i class="fas fa-trash-alt"></i></button>
          </div>
        </li>
        <li class="geofence-item">
          <div class="geofence-item-header">
            <h4>Main Road</h4>
            <span class="geofence-type type-danger">Danger Zone</span>
          </div>
          <div class="geofence-actions">
            <button title="Edit"><i class="fas fa-edit"></i></button>
            <button title="Delete"><i class="fas fa-trash-alt"></i></button>
          </div>
        </li>
      </ul>
    </aside>
  </div>
</main>

<script>
  function initMap() {
    // Center map on Colombo
    const mapCenter = { lat: 6.9271, lng: 79.8612 };
    const map = new google.maps.Map(document.getElementById("map"), {
      zoom: 13,
      center: mapCenter,
      mapTypeControl: false,
    });

    // 1. "Home" Safe Zone (Circle)
    const homeGeofence = new google.maps.Circle({
      strokeColor: '#f59e0b',
      strokeOpacity: 0.8,
      strokeWeight: 2,
      fillColor: '#f59e0b',
      fillOpacity: 0.35,
      map: map,
      center: { lat: 6.9150, lng: 79.8588 }, // Example location
      radius: 300 // in meters
    });

    // 2. "Local Park" Safe Zone (Polygon)
    const parkCoordinates = [
      { lat: 6.9126, lng: 79.8636 },
      { lat: 6.9140, lng: 79.8660 },
      { lat: 6.9115, lng: 79.8675 },
      { lat: 6.9100, lng: 79.8650 },
    ];
    const parkGeofence = new google.maps.Polygon({
      paths: parkCoordinates,
      strokeColor: '#f59e0b',
      strokeOpacity: 0.8,
      strokeWeight: 2,
      fillColor: '#f59e0b',
      fillOpacity: 0.35,
      map: map,
    });

    // 3. "Main Road" Danger Zone (Polygon)
    const roadCoordinates = [
      { lat: 6.9340, lng: 79.8480 },
      { lat: 6.9342, lng: 79.8495 },
      { lat: 6.9250, lng: 79.8520 },
      { lat: 6.9248, lng: 79.8505 },
    ];
    const roadGeofence = new google.maps.Polygon({
      paths: roadCoordinates,
      strokeColor: '#ef4444',
      strokeOpacity: 0.8,
      strokeWeight: 2,
      fillColor: '#ef4444',
      fillOpacity: 0.35,
      map: map,
    });
  }

  // Mobile Menu Functions
  function toggleMobileMenu() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.querySelector('.mobile-overlay');

    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
  }

  function closeMobileMenu() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.querySelector('.mobile-overlay');

    sidebar.classList.remove('active');
    overlay.classList.remove('active');
  }

  // Close mobile menu when window is resized
  window.addEventListener('resize', function() {
    if (window.innerWidth > 768) {
      closeMobileMenu();
    }
  });

  // Close mobile menu when clicking on sidebar links (mobile)
  document.addEventListener('DOMContentLoaded', function() {
    const sidebarLinks = document.querySelectorAll('.sidebar-nav a');
    sidebarLinks.forEach(link => {
      link.addEventListener('click', function() {
        if (window.innerWidth <= 768) {
          closeMobileMenu();
        }
      });
    });
  });
</script>

<script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDg7_ygvD2iISNMCdpe1QJiIvY-RBZ6B6M&callback=initMap">
</script>

<script>
  // Add click event listeners to all buttons
  document.addEventListener('DOMContentLoaded', function() {
    const createBtn = document.querySelector('.create-btn');
    const actionBtns = document.querySelectorAll('.geofence-actions button');

    // Create button click
    createBtn.addEventListener('click', function() {
      this.classList.add('clicked');
      this.style.color = 'white';
      setTimeout(() => {
        this.classList.remove('clicked');
      }, 200);
    });

    // Action buttons click
    actionBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        this.classList.add('clicked');
        this.style.color = 'white';
        setTimeout(() => {
          this.classList.remove('clicked');
        }, 200);
      });
    });
  });
</script>
</body>
</html>
